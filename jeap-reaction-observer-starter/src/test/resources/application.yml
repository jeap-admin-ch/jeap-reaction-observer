spring:
  application:
    name: test
  main:
    banner-mode: off

jeap:
  reaction:
    observer:
      events:
        reaction-identified-topic: reaction-identified
        reactions-observed-topic: reactions-observed
        observed-event-rate-seconds: 3
  messaging:
    kafka:
      error-topic-name: error
      system-name: test-system-name
      service-name: test-service-name

logging:
  level:
    ch.admin.bit.jeap.reaction.observer: TRACE
    org: WARN
    kafka: ERROR
    state.change.logger: WARN
    ch.admin.bit.jeap.messaging.kafka.serde.confluent.config: WARN
    io.confluent.kafka.serializers: WARN
